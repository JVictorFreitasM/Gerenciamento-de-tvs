server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # OS 12-C: /api e a unica coisa que a SPA fala com o backend via proxy
    # server-to-server (mesma origem do ponto de vista do navegador, evita
    # CORS). /auth/login, /auth/logout, /tv/*, /videos, /uploads continuam
    # sendo navegacao/requisicao direta pro backend (porta propria) - nao
    # fazem parte da SPA (OS 12-C, secao 3.1/6).
    location /api/ {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store";
    }

    # Arquivos com hash no nome (dist/assets/*) podem cachear pra sempre -
    # um deploy novo gera nomes novos, nunca reaproveita um arquivo velho
    # sob o mesmo nome.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html NUNCA pode ficar em cache — e ele quem aponta pro arquivo
    # JS com hash certo a cada deploy. Sem isto, um navegador que carregou
    # a SPA antes de um deploy pode continuar servindo o HTML/JS antigo do
    # cache por tempo indefinido (sem nenhuma requisicao nova aparecer no
    # log do nginx), rodando bug ja corrigido no bundle novo sem o usuario
    # perceber - foi exatamente o que aconteceu com o loop de /api/me.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
