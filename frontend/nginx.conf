server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # OS 12-C: /api e a unica coisa que a SPA fala com o backend via proxy
    # server-to-server (mesma origem do ponto de vista do navegador, evita
    # CORS). /auth/login, /auth/logout, /tv/*, /videos, /uploads continuam
    # sendo navegacao/requisicao direta pro backend (porta propria) - nao
    # fazem parte da SPA (OS 12-C, secao 3.1/6).
    location /api/ {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
